<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPOC Login - BarelyPassing</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

<div class="brand-header">
    <div class="logo"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg></div>
    <h1>BarelyPassing</h1>
</div>
<div class="brand-subtext">
    <p class="primary-sub">Institution Partner Portal</p>
</div>

<!--
  A separate, deliberately unbranded entry point rather than a fifth tab on
  the main login page. The four existing tabs are "pick your role at this
  institution" — a SPOC belongs to no institution's day-to-day, so mixing it
  into that picker would confuse the 99% of visitors who are students,
  faculty, or staff. Same POST /auth/login underneath; nothing new in the
  auth pipeline itself.
-->
<div class="login-card" style="max-width:480px;">
    <div class="right-panel" style="width:100%;">
        <div class="form-header">
            <div class="form-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg>
            </div>
            <div class="form-title">
                <h2>SPOC Sign In</h2>
                <p>Manage your college's subscription and reach our team</p>
            </div>
        </div>

        <form id="spocLoginForm" novalidate onsubmit="handleSpocLogin(event)">
            <div class="input-group">
                <label class="label-premium">Email Address</label>
                <div class="input-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <input type="email" id="spocEmail" placeholder="spoc@yourcollege.edu" required>
                </div>
                <div class="error-msg">Please enter a valid email.</div>
            </div>

            <div class="input-group">
                <label class="label-premium">Password</label>
                <div class="input-icon-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="spocPassword" placeholder="Enter your password" required minlength="6">
                </div>
                <div class="error-msg">Password must be at least 6 characters.</div>
            </div>

            <button type="submit" class="submit-btn" id="spocLoginBtn">Sign In</button>
        </form>

        <p class="terms">Not a SPOC? <a href="login.html">Go to the main sign-in page</a></p>
    </div>
</div>

<div class="footer-contact">
    Need help? Contact <a href="mailto:barely.passing@iiits.in">barely.passing@iiits.in</a>
</div>

<script src="state.js"></script>
<script>
async function handleSpocLogin(event) {
    event.preventDefault();
    const email = document.getElementById('spocEmail')?.value.trim();
    const password = document.getElementById('spocPassword')?.value.trim();
    const btn = document.getElementById('spocLoginBtn');
    if (!email || !password) {
        alert('Email and password are required');
        return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
        // window.Auth.login() already redirects by role — see state.js:159-169
        // — so a non-SPOC account is simply sent to its own dashboard instead
        // of landing here by mistake.
        await window.Auth.login(email, password);
    } catch (err) {
        alert(err.message || 'Login failed');
        btn.disabled = false;
        btn.textContent = 'Sign In';
    }
}
</script>
</body>
</html>
