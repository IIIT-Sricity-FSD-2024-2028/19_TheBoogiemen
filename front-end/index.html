<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BarelyPassing | B2B Enterprise EdTech Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- React & Redux UMD Libraries -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@reduxjs/toolkit@1.9.7/dist/redux-toolkit.umd.js"></script>
    <script src="https://unpkg.com/react-redux@8.1.3/dist/react-redux.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="state.js"></script>
    <script src="fixes.js"></script>
  </head>
  <!-- ── BarelyPassing Theme Override: White + Navy Blue (matches old platform) ── -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --navy: #0f172a;
      --navy-mid: #1e1b4b;
      --navy-light: #1e293b;
      --indigo: #6366f1;
      --indigo-dark: #4338ca;
      --blue: #2563eb;
      --white: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    *, *::before, *::after { font-family: 'Outfit', 'Inter', system-ui, sans-serif !important; }

    /* ── Root app wrapper ── */
    #root { background: var(--bg) !important; }

    /* ── Navbar: white + navy ── */
    nav.bp-nav {
      background: var(--navy) !important;
      border-bottom: 1px solid rgba(255,255,255,0.08) !important;
      color: white !important;
      box-shadow: 0 2px 16px rgba(15,23,42,0.3) !important;
    }
    nav.bp-nav button, nav.bp-nav a { color: #94a3b8 !important; font-family: 'Outfit', sans-serif !important; }
    nav.bp-nav button:hover, nav.bp-nav a:hover { color: white !important; }
    nav.bp-nav .bp-nav-active { background: rgba(99,102,241,0.2) !important; color: white !important; }

    /* ── Main content area ── */
    main { background: var(--bg) !important; }

    /* ── Dark card overrides → white cards ── */
    .bg-slate-900, .bg-slate-950 { background: #ffffff !important; }
    .bg-slate-900\/40, .bg-slate-950\/40 { background: rgba(255,255,255,0.7) !important; }
    .bg-slate-800 { background: #f1f5f9 !important; }
    .bg-slate-950\/60, .bg-slate-950\/80 { background: rgba(255,255,255,0.9) !important; }
    .bg-slate-900\/90 { background: var(--navy) !important; }  /* navbar stays dark */

    /* ── Text overrides ── */
    .text-slate-100 { color: var(--text) !important; }
    .text-slate-200 { color: #334155 !important; }
    .text-slate-300 { color: var(--muted) !important; }
    .text-slate-400 { color: #94a3b8 !important; }
    .text-white { color: var(--text) !important; }

    /* ── Navbar-specific: keep text white ── */
    nav .text-slate-100, nav .text-slate-200, nav .text-slate-300, nav .text-white,
    nav .text-slate-400 { color: rgba(255,255,255,0.8) !important; }
    nav .text-indigo-300 { color: #a5b4fc !important; }

    /* ── Borders ── */
    .border-slate-800, .border-slate-800\/50, .border-slate-800\/80 { border-color: var(--border) !important; }
    .border-slate-700 { border-color: #cbd5e1 !important; }

    /* ── Section backgrounds ── */
    .min-h-screen { background: var(--bg) !important; color: var(--text) !important; }

    /* ── Cards ── */
    .rounded-3xl, .rounded-2xl {
      box-shadow: 0 1px 4px rgba(0,0,0,0.06) !important;
    }

    /* ── Landing hero section ── */
    .bp-hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%) !important;
      color: white !important;
    }
    .bp-hero h1, .bp-hero p, .bp-hero span { color: white !important; }

    /* ── Role cards on landing ── */
    .bp-role-card {
      background: white !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      transition: box-shadow 0.2s, transform 0.2s !important;
    }
    .bp-role-card:hover {
      box-shadow: 0 4px 20px rgba(99,102,241,0.15) !important;
      transform: translateY(-2px) !important;
    }

    /* ── Tab navs inside portals ── */
    .bp-tabs { background: white !important; border: 1px solid var(--border) !important; border-radius: 12px !important; padding: 6px !important; }
    .bp-tab { color: var(--muted) !important; font-weight: 600 !important; border-radius: 8px !important; padding: 8px 16px !important; cursor: pointer !important; }
    .bp-tab-active { background: var(--navy) !important; color: white !important; }
    .bp-tab:hover:not(.bp-tab-active) { background: #f1f5f9 !important; color: var(--text) !important; }

    /* ── Stats/metric cards ── */
    .bp-metric-card {
      background: white !important; border: 1px solid var(--border) !important;
      border-radius: 16px !important; padding: 20px !important;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05) !important;
    }
    .bp-metric-card .label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .bp-metric-card .value { font-size: 28px; font-weight: 800; color: var(--navy); margin-top: 6px; }

    /* ── Header bands inside portal views ── */
    .bp-portal-header {
      background: linear-gradient(135deg, var(--navy) 0%, #1e3a5f 100%) !important;
      color: white !important; border-radius: 16px !important;
      padding: 24px !important; margin-bottom: 20px !important;
    }
    .bp-portal-header h1, .bp-portal-header p, .bp-portal-header span { color: white !important; }

    /* ── Buttons ── */
    .bp-btn-primary {
      background: var(--navy) !important; color: white !important;
      border-radius: 8px !important; padding: 10px 20px !important;
      font-weight: 600 !important; font-size: 13px !important;
      border: none !important; cursor: pointer !important;
      transition: background 0.2s !important;
    }
    .bp-btn-primary:hover { background: #1e293b !important; }

    /* ── Tables inside portals ── */
    table { width: 100% !important; border-collapse: collapse !important; }
    table th { background: #f8fafc !important; color: var(--muted) !important; font-size: 11px !important; text-transform: uppercase !important; padding: 10px 12px !important; }
    table td { padding: 10px 12px !important; border-bottom: 1px solid var(--border) !important; font-size: 13px !important; color: var(--text) !important; }
    table tr:hover td { background: #f1f5f9 !important; }

    /* ── Modals ── */
    .bp-modal-backdrop { background: rgba(15,23,42,0.7) !important; }
    .bp-modal { background: white !important; border-radius: 20px !important; box-shadow: 0 20px 60px rgba(0,0,0,0.2) !important; }
    .bp-modal h3 { color: var(--navy) !important; }
    .bp-modal label { color: var(--muted) !important; font-size: 12px !important; font-weight: 600 !important; }
    .bp-modal input, .bp-modal select {
      border: 1.5px solid var(--border) !important; border-radius: 8px !important;
      padding: 8px 12px !important; color: var(--text) !important;
      background: white !important;
    }

    /* ── Footer ── */
    footer { background: var(--navy) !important; color: rgba(255,255,255,0.5) !important; border-top: none !important; }

    /* ── Toast notifications ── */
    .bg-indigo-950\/90 { background: var(--navy) !important; color: white !important; }
    .border-indigo-500\/80 { border-color: var(--indigo) !important; }
    .text-indigo-100 { color: rgba(255,255,255,0.9) !important; }

    /* ── Portal section headings ── */
    .bp-section-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }

    /* ── Progress bars ── */
    .bg-emerald-500 { background: #10b981 !important; }
    .bg-indigo-600 { background: var(--indigo) !important; }
    .bg-red-500 { background: var(--danger) !important; }
    .bg-amber-400 { background: var(--warning) !important; }

    /* ── Badge pills ── */
    .bg-indigo-500\/20 { background: rgba(99,102,241,0.1) !important; }
    .text-indigo-300 { color: var(--indigo) !important; }
    .text-emerald-400 { color: #059669 !important; }
    .text-indigo-400 { color: var(--indigo) !important; }
    .text-amber-400 { color: #d97706 !important; }
    .bg-purple-950\/40, .bg-amber-950\/40, .bg-blue-950\/40, .bg-emerald-950\/40, .bg-indigo-950\/40 {
      background: white !important;
    }
    .border-purple-700\/50, .border-amber-700\/50, .border-blue-700\/50, .border-emerald-700\/50, .border-indigo-700\/50 {
      border-color: var(--border) !important;
    }

    /* ── Dark gradient headers inside portals ── */
    .bg-gradient-to-r.from-indigo-950\/60, .bg-gradient-to-r.from-slate-900 {
      background: linear-gradient(135deg, var(--navy) 0%, #1e3a5f 100%) !important;
    }
    .bg-blue-950\/40 { background: #eff6ff !important; }
    .text-blue-300 { color: var(--blue) !important; }
    .text-blue-200\/70 { color: #3b82f6 !important; }

    /* ── inline dark text in dark zones (keep white) ── */
    .bg-gradient-to-r .text-white,
    .bp-portal-header .text-white,
    .bp-hero .text-white { color: white !important; }

    /* ── Role card text colors in the subscribed accounts ── */
    .bg-purple-950\/40 .text-purple-300 { color: #7c3aed !important; }
    .bg-amber-950\/40 .text-amber-300 { color: #b45309 !important; }
    .bg-blue-950\/40 .text-blue-300 { color: var(--blue) !important; }
    .bg-emerald-950\/40 .text-emerald-300 { color: #047857 !important; }
    .bg-indigo-950\/40 .text-indigo-300 { color: var(--indigo) !important; }

    .bg-purple-950\/40 .text-white,
    .bg-amber-950\/40 .text-white,
    .bg-blue-950\/40 .text-white,
    .bg-emerald-950\/40 .text-white,
    .bg-indigo-950\/40 .text-white { color: var(--navy) !important; }

    /* ── HOD/Student tab buttons ── */
    .bg-slate-900 button.text-slate-400 { color: var(--muted) !important; }
    .bg-slate-900 button.text-white { color: var(--text) !important; }

    /* ── Inputs in modals/forms (dark → white) ── */
    .bg-slate-950.border.border-slate-800 {
      background: white !important;
      border-color: var(--border) !important;
      color: var(--text) !important;
    }
    input.bg-slate-950, select.bg-slate-950, textarea.bg-slate-950 {
      background: white !important;
      border: 1.5px solid var(--border) !important;
      color: var(--text) !important;
    }
  </style>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;
      const { configureStore, createSlice, createAsyncThunk } = RTK;
      const { Provider, useSelector, useDispatch } = ReactRedux;

      // ── 1. Custom Redux Middlewares ──
      const tokenAuthMiddleware = store => next => async action => {
        const result = next(action);
        if (action.type?.endsWith('/rejected') && action.payload?.status === 401) {
          console.warn('🔑 tokenAuthMiddleware: Intercepted 401 Unauthorized.');
        }
        return result;
      };

      const quotaCheckerMiddleware = store => next => action => {
        const result = next(action);
        if (action.type?.startsWith('tenant/') || action.type?.startsWith('subscription/')) {
          const state = store.getState();
          const activeTenant = state.tenant?.activeTenant;
          if (activeTenant && activeTenant.monthly_token_quota > 0) {
            const pct = Math.round((activeTenant.used_tokens / activeTenant.monthly_token_quota) * 100);
            if (pct >= 90 && !state.ui?.alertShown) {
              store.dispatch(addNotification({
                id: `q-${Date.now()}`,
                type: 'danger',
                title: 'Token Quota Alert (90%)',
                message: `${activeTenant.name} has used ${pct}% of monthly API tokens.`
              }));
            }
          }
        }
        return result;
      };

      const auditLoggerMiddleware = store => next => action => {
        const result = next(action);
        if (['subscription/upgradeTier', 'tenant/onboard'].some(a => action.type?.includes(a))) {
          console.log('📋 auditLoggerMiddleware: Action logged ->', action.type);
        }
        return result;
      };

      // ── 2. Redux Async Thunks & Slices ──
      const loginThunk = createAsyncThunk('auth/login', async ({ email, password, tenant_code }, { rejectWithValue }) => {
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password, tenant_code }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) return rejectWithValue(data.message || 'Invalid credentials');
          return data;
        } catch (e) {
          return rejectWithValue('Network connection error');
        }
      });

      const authSlice = createSlice({
        name: 'auth',
        initialState: {
          accessToken: localStorage.getItem('accessToken') || null,
          refreshToken: localStorage.getItem('refreshToken') || null,
          user: JSON.parse(localStorage.getItem('user') || 'null'),
          tenant: JSON.parse(localStorage.getItem('tenant') || 'null'),
          isAuthenticated: !!localStorage.getItem('accessToken'),
          loading: false,
          error: null,
        },
        reducers: {
          logout: (state) => {
            state.user = null;
            state.tenant = null;
            state.accessToken = null;
            state.refreshToken = null;
            state.isAuthenticated = false;
            state.error = null;
          },
          clearError: (state) => { state.error = null; }
        },
        extraReducers: (builder) => {
          builder
            .addCase(loginThunk.pending, (state) => { state.loading = true; state.error = null; })
            .addCase(loginThunk.fulfilled, (state, action) => {
              state.loading = false;
              state.isAuthenticated = true;
              state.accessToken = action.payload.accessToken || action.payload.token;
              state.refreshToken = action.payload.refreshToken;
              state.user = action.payload.user;
              state.tenant = action.payload.tenant;
              localStorage.setItem('accessToken', state.accessToken);
              if (state.refreshToken) localStorage.setItem('refreshToken', state.refreshToken);
              localStorage.setItem('user', JSON.stringify(state.user));
              localStorage.setItem('tenant', JSON.stringify(state.tenant));
            })
            .addCase(loginThunk.rejected, (state, action) => {
              state.loading = false;
              state.error = action.payload || 'Login failed';
            });
        }
      });

      const fetchTenantsThunk = createAsyncThunk('tenant/fetchAll', async () => {
        const res = await fetch('/api/platform/tenants');
        return await res.json();
      });

      const onboardTenantThunk = createAsyncThunk('tenant/onboard', async (data, { rejectWithValue }) => {
        try {
          const res = await fetch('/api/platform/tenants/onboard', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const result = await res.json();
          if (!res.ok) return rejectWithValue(result.message || 'Onboarding failed');
          return result;
        } catch (e) {
          return rejectWithValue('Network error');
        }
      });

      const tenantSlice = createSlice({
        name: 'tenant',
        initialState: { allTenants: [], activeTenant: JSON.parse(localStorage.getItem('tenant') || 'null') },
        reducers: {
          setActiveTenant: (state, action) => {
            state.activeTenant = action.payload;
            localStorage.setItem('tenant', JSON.stringify(action.payload));
          }
        },
        extraReducers: (builder) => {
          builder
            .addCase(fetchTenantsThunk.fulfilled, (state, action) => { state.allTenants = action.payload; })
            .addCase(onboardTenantThunk.fulfilled, (state, action) => {
              if (action.payload.tenant) state.allTenants.push(action.payload.tenant);
            });
        }
      });

      const fetchTokenMeterThunk = createAsyncThunk('subscription/fetchMeter', async (tenantId) => {
        const res = await fetch(`/api/platform/tokens/meter?tenant_id=${tenantId || 't1'}`, {
          headers: { 'x-tenant-id': tenantId || 't1' }
        });
        return await res.json();
      });

      const subscriptionSlice = createSlice({
        name: 'subscription',
        initialState: { tokenMeter: null },
        reducers: {},
        extraReducers: (builder) => {
          builder.addCase(fetchTokenMeterThunk.fulfilled, (state, action) => {
            state.tokenMeter = action.payload;
          });
        }
      });

      const fetchHierarchyThunk = createAsyncThunk('hierarchy/fetch', async (tenantId) => {
        const res = await fetch(`/api/platform/hierarchy?tenant_id=${tenantId || 't1'}`, {
          headers: { 'x-tenant-id': tenantId || 't1' }
        });
        return await res.json();
      });

      const hierarchySlice = createSlice({
        name: 'hierarchy',
        initialState: { departments: [], hierarchy: { director_super_admin: [], department_heads: [], faculty_mentors: [], students: [] } },
        reducers: {},
        extraReducers: (builder) => {
          builder.addCase(fetchHierarchyThunk.fulfilled, (state, action) => {
            state.departments = action.payload.departments || [];
            state.hierarchy = action.payload.hierarchy || state.hierarchy;
          });
        }
      });

      const uiSlice = createSlice({
        name: 'ui',
        initialState: { activeView: 'landing', notifications: [], isLoginModalOpen: false, isOnboardModalOpen: false, isProfileModalOpen: false },
        reducers: {
          setActiveView: (state, action) => { state.activeView = action.payload; },
          setLoginModalOpen: (state, action) => { state.isLoginModalOpen = action.payload; },
          setOnboardModalOpen: (state, action) => { state.isOnboardModalOpen = action.payload; },
          setProfileModalOpen: (state, action) => { state.isProfileModalOpen = action.payload; },
          addNotification: (state, action) => { state.notifications.unshift(action.payload); },
          removeNotification: (state, action) => {
            state.notifications = state.notifications.filter(n => n.id !== action.payload);
          }
        }
      });

      const { logout, clearError, updateUserProfile } = authSlice.actions;
      const { setActiveView, setLoginModalOpen, setOnboardModalOpen, setProfileModalOpen, addNotification, removeNotification } = uiSlice.actions;

      const store = configureStore({
        reducer: {
          auth: authSlice.reducer,
          tenant: tenantSlice.reducer,
          subscription: subscriptionSlice.reducer,
          hierarchy: hierarchySlice.reducer,
          ui: uiSlice.reducer,
        },
        middleware: (getDefaultMiddleware) =>
          getDefaultMiddleware().concat(tokenAuthMiddleware, quotaCheckerMiddleware, auditLoggerMiddleware),
      });

      // ── 3. Components ──
      function Navbar() {
        const dispatch = useDispatch();
        const { isAuthenticated, user, tenant } = useSelector((state) => state.auth);
        const { activeView } = useSelector((state) => state.ui);
        const { tokenMeter } = useSelector((state) => state.subscription);

        return (
          <nav className="bp-nav sticky top-0 z-50 px-6 py-3.5 flex items-center justify-between" style={{background:'#0f172a',borderBottom:'1px solid rgba(255,255,255,0.08)',boxShadow:'0 2px 16px rgba(15,23,42,0.35)'}}>
            <div className="flex items-center space-x-4 cursor-pointer" onClick={() => dispatch(setActiveView('landing'))}>
              <div style={{width:40,height:40,borderRadius:10,background:'linear-gradient(135deg,#6366f1,#4338ca)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:18,color:'white',flexShrink:0}}>
                BP
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <span style={{fontWeight:800,fontSize:17,color:'white',letterSpacing:'-0.3px'}}>
                    BarelyPassing
                  </span>
                  <span style={{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'1px',padding:'2px 8px',borderRadius:20,background:'rgba(99,102,241,0.3)',color:'#a5b4fc',border:'1px solid rgba(165,180,252,0.3)'}}>
                    EdTech Platform
                  </span>
                </div>
                {tenant && (
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.6)',display:'flex',alignItems:'center',gap:6,marginTop:2}}>
                    <span>{tenant.logo || '🏫'}</span>
                    <span style={{color:'#a5b4fc',fontWeight:600}}>{tenant.name}</span>
                    <span>•</span>
                    <span>{tenant.subscription_tier}</span>
                  </div>
                )}
              </div>
            </div>

            {isAuthenticated && (
              <div className="hidden md:flex items-center space-x-1" style={{background:'rgba(255,255,255,0.07)',padding:6,borderRadius:10,border:'1px solid rgba(255,255,255,0.1)',fontSize:12,fontWeight:600}}>
                {user?.role === 'PLATFORM_SUPER_ADMIN' && (
                  <button onClick={() => dispatch(setActiveView('saas-admin'))} style={{padding:'6px 12px',borderRadius:8,border:'none',cursor:'pointer',background:activeView==='saas-admin'?'#6366f1':'transparent',color:activeView==='saas-admin'?'white':'rgba(255,255,255,0.65)',transition:'all 0.15s'}}>
                    🌐 SaaS Admin
                  </button>
                )}
                {user?.role === 'PLATFORM_SALES_SUPPORT' && (
                  <button onClick={() => dispatch(setActiveView('internal-support'))} style={{padding:'6px 12px',borderRadius:8,border:'none',cursor:'pointer',background:activeView==='internal-support'?'#d97706':'transparent',color:activeView==='internal-support'?'white':'rgba(255,255,255,0.65)',transition:'all 0.15s'}}>
                    🛡️ Platform Support
                  </button>
                )}
                {(user?.role === 'INSTITUTE_SUPER_ADMIN' || user?.role === 'superadmin' || user?.role === 'admin') && (
                  <button onClick={() => dispatch(setActiveView('institute-admin'))} style={{padding:'6px 12px',borderRadius:8,border:'none',cursor:'pointer',background:activeView==='institute-admin'?'#6366f1':'transparent',color:activeView==='institute-admin'?'white':'rgba(255,255,255,0.65)',transition:'all 0.15s'}}>
                    🏛️ Director Portal
                  </button>
                )}
                {(user?.role === 'DEPARTMENT_ADMIN_HOD' || user?.role === 'head') && (

      function ProfileModal({ isOpen, onClose }) {
        const dispatch = useDispatch();
        const { user } = useSelector((state) => state.auth);

        const [formData, setFormData] = useState({
          first_name: user?.first_name || user?.name?.split(' ')[0] || 'User',
          last_name: user?.last_name || user?.name?.split(' ').slice(1).join(' ') || '',
          email: user?.email || '',
          phone: user?.phone || '+91 98765 43210',
          department: user?.department || 'Computer Science & Engineering',
          batch: user?.batch || '2024-2028',
          bio: user?.bio || 'Passionate about academic excellence and research.',
        });
        const [savedSuccess, setSavedSuccess] = useState(false);

        useEffect(() => {
          if (user) {
            setFormData({
              first_name: user.first_name || user.name?.split(' ')[0] || 'User',
              last_name: user.last_name || user.name?.split(' ').slice(1).join(' ') || '',
              email: user.email || '',
              phone: user.phone || '+91 98765 43210',
              department: user.department || 'Computer Science & Engineering',
              batch: user.batch || '2024-2028',
              bio: user.bio || 'Passionate about academic excellence and research.',
            });
          }
        }, [user]);

        if (!isOpen) return null;

        const handleSave = (e) => {
          e.preventDefault();
          const fullName = `${formData.first_name} ${formData.last_name}`.trim();
          dispatch(updateUserProfile({ ...formData, name: fullName }));
          setSavedSuccess(true);
          setTimeout(() => {
            setSavedSuccess(false);
            onClose();
          }, 1200);
        };

        const getRoleBadge = (role) => {
          if (role === 'student') return { label: 'Level 4: Student', color: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/30' };
          if (role === 'faculty') return { label: 'Level 3: Faculty', color: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' };

        );
      }

      function InstituteAdminPortalView() {
        const dispatch = useDispatch();
        const { tenant } = useSelector((state) => state.auth);
        const { tokenMeter } = useSelector((state) => state.subscription);
        const { hierarchy } = useSelector((state) => state.hierarchy);
        const tenantId = tenant?.tenant_id || 't1';

        useEffect(() => {
          dispatch(fetchHierarchyThunk(tenantId));
          dispatch(fetchTokenMeterThunk(tenantId));
        }, [dispatch, tenantId]);

        return (
          <div className="p-6 max-w-7xl mx-auto space-y-8">
            <div className="bg-gradient-to-r from-slate-900 via-indigo-950/60 to-slate-900 p-6 rounded-3xl border border-indigo-500/30 flex items-center justify-between">
              <div>
                <span className="px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-bold uppercase">🏛️ Level 1: Institute Director</span>
                <h1 className="text-2xl font-black text-white">{tenant?.name || 'IIIT Sricity Workspace'}</h1>
                <p className="text-xs text-indigo-200/70 font-mono mt-0.5">Code: {tenant?.code} • Domain: {tenant?.domain}</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div className="text-xs text-slate-400 font-semibold">Seat Allocation</div>
                <div className="text-2xl font-black text-indigo-400 mt-2">120 / 500 Active Seats</div>
              </div>
              <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
                <div className="text-xs text-slate-400 font-semibold">Active Faculty & Students</div>
                <div className="text-2xl font-black text-emerald-400 mt-2">{(hierarchy.faculty_mentors?.length || 0) + (hierarchy.students?.length || 0)}</div>
              </div>
            </div>
          </div>
        );
      }

      function SaaSAdminPortalView() {
        const dispatch = useDispatch();
        const { allTenants } = useSelector((state) => state.tenant);
        useEffect(() => { dispatch(fetchTenantsThunk()); }, [dispatch]);

        return (
          <div className="p-6 max-w-7xl mx-auto space-y-8">
            <div className="bg-purple-950/40 p-6 rounded-3xl border border-purple-800/50 flex items-center justify-between">
              <div>
                <span className="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-xs font-bold">🌐 Level 0: SaaS Owner</span>
                <h1 className="text-2xl font-black text-white mt-1">Platform Super Admin Control</h1>
              </div>
            </div>

            <div className="bg-slate-900 rounded-3xl border border-slate-800 p-6 overflow-x-auto">
              <h2 className="text-lg font-bold text-white mb-4">Subscribed Educational Institutions</h2>
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950 text-slate-400 uppercase font-semibold border-b border-slate-800">
                  <tr>
                    <th className="p-3">Institute</th>
                    <th className="p-3">Code</th>
                    <th className="p-3">Tier</th>
                    <th className="p-3">Seats</th>
                    <th className="p-3">Token Meter</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {allTenants.map(t => (
                    <tr key={t.tenant_id}>
                      <td className="p-3 font-bold">{t.name}</td>
                      <td className="p-3 font-mono text-indigo-300">{t.code}</td>
                      <td className="p-3 text-purple-300">{t.subscription_tier}</td>
                      <td className="p-3">{t.seats_used} / {t.seats_allocated}</td>
                      <td className="p-3 font-mono">{t.used_tokens} / {t.monthly_token_quota}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      function InternalSupportDashboardView() {
        return (
          <div className="p-6 max-w-7xl mx-auto space-y-8">
            <div className="bg-amber-950/40 p-6 rounded-3xl border border-amber-700/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span className="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-xs font-bold">🛡️ Level 0: Platform Support Team</span>
                <h1 className="text-2xl font-black text-white mt-1">Platform Customer Success & Support Portal</h1>
              </div>
            </div>
          </div>
        );
      }

      function AppMain() {
        const { activeView, notifications } = useSelector((state) => state.ui);
        const { isAuthenticated, user } = useSelector((state) => state.auth);
        const dispatch = useDispatch();

        const renderView = () => {
          switch (activeView) {
            case 'saas-admin': return <SaaSAdminPortalView />;
            case 'internal-support': return <InternalSupportDashboardView />;
            case 'institute-admin': return <InstituteAdminPortalView />;
            case 'hod': return <HODDashboardView />;
            case 'faculty': return <FacultyPortalView />;
            case 'student': return <StudentPortalView />;
            case 'landing':
            default:
              if (isAuthenticated) {
                if (user?.role === 'PLATFORM_SUPER_ADMIN') return <SaaSAdminPortalView />;
                if (user?.role === 'PLATFORM_SALES_SUPPORT') return <InternalSupportDashboardView />;
                if (user?.role === 'INSTITUTE_SUPER_ADMIN' || user?.role === 'superadmin' || user?.role === 'admin') return <InstituteAdminPortalView />;
                if (user?.role === 'DEPARTMENT_ADMIN_HOD' || user?.role === 'head') return <HODDashboardView />;
                if (user?.role === 'faculty') return <FacultyPortalView />;
                return <StudentPortalView />;
              }
              return <LandingPage />;
          }
        };

        return (
          <div style={{minHeight:'100vh',background:'#f8fafc',color:'#1e293b',display:'flex',flexDirection:'column',fontFamily:"'Outfit','Inter',sans-serif"}}>
            <Navbar />
            <div className="fixed bottom-6 right-6 z-50 space-y-3 max-w-md w-full px-4 pointer-events-none">
              {notifications.map((n) => (
                <div key={n.id} className="pointer-events-auto p-4 rounded-2xl border bg-indigo-950/90 border-indigo-500/80 text-indigo-100 shadow-2xl flex items-start justify-between" style={{background:'#0f172a',borderColor:'#6366f1'}}>
                  <div>
                    <div className="font-bold text-xs" style={{color:'white'}}>{n.title}</div>
                    <div className="text-[11px] opacity-90 mt-0.5" style={{color:'rgba(255,255,255,0.7)'}}>{n.message}</div>
                  </div>
                  <button onClick={() => dispatch(removeNotification(n.id))} className="text-xs font-bold ml-3 cursor-pointer" style={{color:'rgba(255,255,255,0.6)'}}>✕</button>
                </div>
              ))}
            </div>
            <main className="flex-1" style={{background:'#f8fafc'}}>{renderView()}</main>
            <ProfileModal isOpen={isProfileModalOpen} onClose={() => dispatch(setProfileModalOpen(false))} />
            <footer style={{background:'#0f172a',borderTop:'1px solid rgba(255,255,255,0.1)',padding:'20px 24px',textAlign:'center',fontSize:12,color:'rgba(255,255,255,0.5)'}}>
              BarelyPassing Enterprise EdTech Platform
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(
        <Provider store={store}>
          <AppMain />
        </Provider>
      );
    </script>
  </body>
</html>
